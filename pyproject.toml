[project]
name = "hospital-twin"
version = "0.1.0"
description = "Gemini 4 NYC Hackathon (Element 119): Hospital unit floor plan to animated nurse vs. courier-robot shift twin."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "google-genai>=1.0.0",
    "networkx>=3.2",
    "simpy>=4.1",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
